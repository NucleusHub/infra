# GENERATED by 'nucleus generate' (infra/tool) — do not edit manually
# Production stack: nginx serves pre-built static files, servers run node index.js
name: nucleus

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "proxy"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../hub/dist:/srv/hub:ro
      - ../hub/public:/srv/static:ro
      - ../apps/admin/client/dist:/srv/admin:ro
      - ../apps/echo/client/dist:/srv/echo:ro
      - ../apps/goal-calendar/client/dist:/srv/goals:ro
      - ../apps/orbit/client/dist:/srv/orbit:ro
      - ../apps/watchlist/client/dist:/srv/watchlist:ro
      - ../widgets/spotify/client/dist:/srv/spotify:ro
      - /etc/ssl/certs/nucleus.crt:/etc/ssl/certs/nucleus.crt:ro
      - /etc/ssl/private/nucleus.key:/etc/ssl/private/nucleus.key:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      registry:
        condition: service_started
      echo-server:
        condition: service_healthy
      goal-calendar-server:
        condition: service_healthy
      orbit-server:
        condition: service_healthy
      pulse-server:
        condition: service_healthy
      watchlist-server:
        condition: service_healthy
      spotify-server:
        condition: service_healthy
      sysinfo-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy

  registry:
    build:
      context: ./registry
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "registry"
    environment:
      PORT: 4000
      APPS_DIR: /apps
      WIDGETS_DIR: /widgets
    volumes:
      - ../apps:/apps:ro
      - ../widgets:/widgets:ro

  echo-server:
    build:
      context: ../apps/echo/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "echo"
      nucleus.depends: "mongo,redis"
    command: ["node", "index.js"]
    environment:
      PORT: 3006
      MONGODB_URI: mongodb://mongo:27017/nucleus
      REDIS_URL: redis://redis:6379
      APPS_DIR: /apps
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/echo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  goal-calendar-server:
    build:
      context: ../apps/goal-calendar/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "goal-calendar"
      nucleus.depends: "mongo"
    command: ["node", "index.js"]
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/nucleus
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/goals/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  orbit-server:
    build:
      context: ../apps/orbit/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "orbit"
      nucleus.depends: "mongo,minio"
    command: ["node", "index.js"]
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongo:27017/nucleus
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nucleusadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nucleuschangeme}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost}
      MINIO_BUCKET: ${MINIO_BUCKET:-orbit-uploads}
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/api/orbit/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  pulse-server:
    build:
      context: ../apps/pulse/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "pulse"
      nucleus.depends: "mongo"
    command: ["node", "index.js"]
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongo:27017/nucleus
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  watchlist-server:
    build:
      context: ../apps/watchlist/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "watchlist"
      nucleus.depends: "mongo"
    command: ["node", "index.js"]
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/nucleus
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  spotify-server:
    build:
      context: ../widgets/spotify/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "widget-server"
      nucleus.app: "spotify"
    command: ["node", "index.js"]
    environment:
      PORT: 3002
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-https://${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}/api/spotify/callback}
      SPOTIFY_SUCCESS_REDIRECT: ${SPOTIFY_SUCCESS_REDIRECT:-https://${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}/spotify}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/spotify/status',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  sysinfo-server:
    build:
      context: ../widgets/sysinfo/server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "widget-server"
      nucleus.app: "sysinfo"
    command: ["node", "index.js"]
    environment:
      PORT: 3010
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/api/sysinfo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-server:
    build:
      context: ../core/auth-server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "auth"
      nucleus.depends: "mongo"
    command: ["node", "index.js"]
    environment:
      PORT: 3005
      MONGODB_URI: mongodb://mongo:27017/nucleus
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/auth/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "database"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet 2>/dev/null || mongo --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "cache"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "object-store"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nucleusadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nucleuschangeme}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:-http://localhost}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mongo_data:
  minio_data:
  redis_data:
  uploads_data:
