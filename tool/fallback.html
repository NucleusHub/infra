<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nucleus — service unavailable</title><style>:root{--bg:#eef2f8;--text:#0f172a;--muted:#64748b;--surface:rgba(255,255,255,.62);--border:rgba(255,255,255,.72);--accent:#7c3aed;--accent2:#0ea5e9;--bv:#a78bfa;--bi:#818cf8;--bb:#60a5fa;--bo:.4}@media(prefers-color-scheme:dark){:root{--bg:#0d0d1a;--text:#f5f3ff;--muted:#a39bc4;--surface:rgba(45,28,78,.55);--border:rgba(160,120,255,.2);--accent:#a78bfa;--accent2:#60a5fa;--bv:#7c3aed;--bi:#4f46e5;--bb:#2563eb;--bo:.45}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1}.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:var(--bo)}.v{width:460px;height:460px;top:-120px;left:-110px;background:var(--bv)}.i{width:460px;height:460px;bottom:-140px;right:-120px;background:var(--bi)}.b{width:280px;height:280px;top:42%;left:46%;filter:blur(80px);background:var(--bb)}.card{max-width:440px;margin:16px;padding:36px;text-align:center;background:var(--surface);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.18)}h1{font-size:22px;margin:0;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}p{color:var(--muted);margin:14px 0 0;line-height:1.55}.svc{color:var(--text);font-weight:600}a.btn{display:inline-block;margin-top:24px;padding:11px 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:10px;text-decoration:none;font-weight:600}a.retry{display:block;margin-top:14px;color:var(--muted);font-size:13px}</style></head><body><div class="blobs"><div class="blob v"></div><div class="blob i"></div><div class="blob b"></div></div><div class="card"><h1>&#9875; Service unavailable</h1><p>The <span class="svc" id="s">Nucleus</span> isn&rsquo;t responding.</p><div id="act"><p id="checking">Checking for Anchor&hellip;</p></div><a class="retry" href="#" onclick="location.reload();return false">Retry</a></div><script>var anchor=location.protocol+"//"+location.hostname+":8888";var seg=location.pathname.split("/").filter(Boolean)[0];document.getElementById("s").textContent=seg?(seg.replace(/-/g," ")+" service"):"Nucleus hub";var act=document.getElementById("act");function clr(){while(act.firstChild)act.removeChild(act.firstChild);}function mkP(t){var p=document.createElement("p");p.textContent=t;return p;}function mkA(t,h){var a=document.createElement("a");a.className="btn";a.href=h;a.textContent=t;return a;}function showOpen(){clr();act.appendChild(mkP("Use Anchor to inspect and recover the stack."));act.appendChild(mkA("Open Anchor →",anchor));}function showDown(){clr();act.appendChild(mkP("Anchor is not responding — it is either stopped or not installed."));act.appendChild(mkA("Install Anchor →","https://example.com"));var hint=mkP("If it is already installed, start it and click Retry.");hint.style.cssText="font-size:13px;margin-top:16px";act.appendChild(hint);}var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},2500);fetch(anchor+"/healthz",{mode:"no-cors",signal:ctrl.signal}).then(function(){clearTimeout(to);showOpen();}).catch(function(){clearTimeout(to);showDown();});</script></body></html>
