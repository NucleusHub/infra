name: nucleus

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nucleus.rule=Host(`nucleus.home`)"
      - "traefik.http.routers.nucleus.entrypoints=web"
      - "traefik.http.routers.nucleus.priority=10"
      - "traefik.http.routers.nucleus-catchall.rule=PathPrefix(`/`)"
      - "traefik.http.routers.nucleus-catchall.entrypoints=web"
      - "traefik.http.routers.nucleus-catchall.priority=1"
      - "traefik.http.routers.nucleus-catchall.service=nucleus"
      - "traefik.http.services.nucleus.loadbalancer.server.port=80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../hub/public:/usr/share/nginx/static:ro
    depends_on:
      - hub
      - registry

  hub:
    build:
      context: ../hub
    restart: unless-stopped
    volumes:
      - ../hub/src:/app/src
      - ../hub/public:/app/public
      - ../hub/index.html:/app/index.html
      - ../hub/vite.config.js:/app/vite.config.js
      - ../widgets:/app/widgets:ro
      - ../core:/app/core:ro

  registry:
    build:
      context: ./registry
    restart: unless-stopped
    environment:
      PORT: 4000
      APPS_DIR: /apps
      WIDGETS_DIR: /widgets
    volumes:
      - ../apps:/apps:ro
      - ../widgets:/widgets:ro

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
