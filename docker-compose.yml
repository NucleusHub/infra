name: nucleus

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../hub/public:/usr/share/nginx/static:ro
      - /etc/ssl/certs/nucleus.crt:/etc/ssl/certs/nucleus.crt:ro
      - /etc/ssl/private/nucleus.key:/etc/ssl/private/nucleus.key:ro
    depends_on:
      - hub
      - registry

  hub:
    build:
      context: ../hub
    restart: unless-stopped
    volumes:
      - ../hub/src:/app/src
      - ../hub/public:/app/public
      - ../hub/index.html:/app/index.html
      - ../hub/vite.config.js:/app/vite.config.js
      - ../widgets:/app/widgets:ro
      - ../core:/app/core:ro
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  registry:
    build:
      context: ./registry
    restart: unless-stopped
    environment:
      PORT: 4000
      APPS_DIR: /apps
      WIDGETS_DIR: /widgets
    volumes:
      - ../apps:/apps:ro
      - ../widgets:/widgets:ro

  # Auth is core infrastructure (always present), so it lives in core/ and is
  # wired here directly rather than being a discoverable app under apps/.
  auth-server:
    build:
      context: ../core/auth-server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    volumes:
      - ../core/auth-server:/app
      - auth_server_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/auth/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: ${MONGO_IMAGE:-mongo:4.4}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet 2>/dev/null || mongo --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nucleusadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nucleuschangeme}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:-http://localhost}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mongo_data:
  minio_data:
  auth_server_modules:
