name: nucleus

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../hub/public:/usr/share/nginx/static:ro
    depends_on:
      - hub
      - registry

  hub:
    build:
      context: ../hub
    restart: unless-stopped
    volumes:
      - ../hub/src:/app/src
      - ../hub/public:/app/public
      - ../hub/index.html:/app/index.html
      - ../hub/vite.config.js:/app/vite.config.js
      - ../widgets:/app/widgets:ro
      - ../core:/app/core:ro

  registry:
    build:
      context: ./registry
    restart: unless-stopped
    environment:
      PORT: 4000
      APPS_DIR: /apps
      WIDGETS_DIR: /widgets
    volumes:
      - ../apps:/apps:ro
      - ../widgets:/widgets:ro

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet 2>/dev/null || mongo --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
