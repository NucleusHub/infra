server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name nucleus.home;

    ssl_certificate     /etc/ssl/certs/nucleus.crt;
    ssl_certificate_key /etc/ssl/private/nucleus.key;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Backend API routes ─────────────────────────────────────────────────

    location /api/registry {
        proxy_pass         http://registry:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /api/spotify {
        proxy_pass         http://spotify-server:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /api/goals {
        proxy_pass         http://goal-calendar-server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /api/orbit {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass         http://orbit-server:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /orbit-uploads {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' '3000' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        set $minio minio:9000;
        proxy_pass         http://$minio;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /uploads {
        proxy_pass         http://watchlist-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    location /api {
        proxy_pass         http://watchlist-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
    }

    # ── Static SPA routes ──────────────────────────────────────────────────
    # Each app is mounted at a separate /srv/* path to avoid nesting bind mounts
    # inside a read-only parent mount (Docker limitation).

    location /watchlist {
        root /srv;
        try_files $uri $uri/ /watchlist/index.html;
    }

    location /goals {
        root /srv;
        try_files $uri $uri/ /goals/index.html;
    }

    location /spotify {
        root /srv;
        try_files $uri $uri/ /spotify/index.html;
    }

    location /orbit {
        root /srv;
        try_files $uri $uri/ /orbit/index.html;
    }

    location ~* ^(/watchlist)?/favicon\.ico$ {
        root /srv/static;
        try_files /favicon.ico =404;
    }

    # Hub SPA — catch-all must come last
    location / {
        root /srv/hub;
        try_files $uri $uri/ /index.html;
    }
}
