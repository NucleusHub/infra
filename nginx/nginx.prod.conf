# Redirect nucleus.olm-altair.ts.net HTTP traffic to HTTPS (external access with TLS cert)
server {
    listen 80;
    server_name nucleus.olm-altair.ts.net;
    return 301 https://nucleus.olm-altair.ts.net$request_uri;
}

# Main server — HTTPS for nucleus.olm-altair.ts.net, plain HTTP for localhost / IP access
server {
    listen 80 default_server;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/nucleus.crt;
    ssl_certificate_key /etc/ssl/private/nucleus.key;

    # Docker's internal DNS — lets nginx start even when optional services aren't up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/registry {
        # Variable + resolver so nginx re-resolves the registry's IP per request
        # (survives registry container restarts without an nginx restart).
        set $registry_upstream registry:4000;
        proxy_pass http://$registry_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Maintenance flag — a static file written by infra/maintenance and served by
    # nginx (not an app server), so it stays reachable while apps are rebuilt.
    # Absent → 204, which the client treats as "not in maintenance".
    location = /maintenance.json {
        root /srv/state;
        add_header Cache-Control "no-store" always;
        try_files /maintenance.json =204;
    }

    location /orbit-uploads {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' '3000' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        set $upstream minio:9000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/spotify {
        set $upstream spotify-server:3002;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sysinfo {
        set $upstream sysinfo-server:3010;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/goals {
        set $upstream goal-calendar-server:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orbit {
        client_max_body_size 0;
        proxy_request_buffering off;
        set $upstream orbit-server:3003;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/prism {
        client_max_body_size 0;
        proxy_request_buffering off;
        set $upstream prism-server:3011;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/pulse {
        set $upstream pulse-server:3004;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/echo {
        set $upstream echo-server:3006;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/auth {
        set $upstream auth-server:3005;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads {
        set $upstream watchlist-server:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
        set $upstream watchlist-server:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /watchlist {
        root /srv;
        try_files $uri $uri/ /watchlist/index.html;
    }

    location /spotify {
        root /srv;
        try_files $uri $uri/ /spotify/index.html;
    }

    location /admin {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
    }

    location /goals {
        root /srv;
        try_files $uri $uri/ /goals/index.html;
    }

    location /orbit {
        root /srv;
        try_files $uri $uri/ /orbit/index.html;
    }

    location /prism {
        root /srv;
        try_files $uri $uri/ /prism/index.html;
    }

    location /echo {
        root /srv;
        try_files $uri $uri/ /echo/index.html;
    }

    location ~* ^(/watchlist)?/favicon\.ico$ {
        root /srv/static;
        try_files /favicon.ico =404;
    }

    # Hub SPA — catch-all (pre-built static files in prod)
    location / {
        root /srv/hub;
        try_files $uri $uri/ /index.html;
        error_page 502 503 504 = @anchor_fallback;
    }

    # Degraded-mode page (manual link to Anchor; never auto-routed).
    location @anchor_fallback {
        default_type text/html;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nucleus — service unavailable</title><style>:root{--bg:#eef2f8;--text:#0f172a;--muted:#64748b;--surface:rgba(255,255,255,.62);--border:rgba(255,255,255,.72);--accent:#7c3aed;--accent2:#0ea5e9;--bv:#a78bfa;--bi:#818cf8;--bb:#60a5fa;--bo:.4}@media(prefers-color-scheme:dark){:root{--bg:#0d0d1a;--text:#f5f3ff;--muted:#a39bc4;--surface:rgba(45,28,78,.55);--border:rgba(160,120,255,.2);--accent:#a78bfa;--accent2:#60a5fa;--bv:#7c3aed;--bi:#4f46e5;--bb:#2563eb;--bo:.45}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1}.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:var(--bo)}.v{width:460px;height:460px;top:-120px;left:-110px;background:var(--bv)}.i{width:460px;height:460px;bottom:-140px;right:-120px;background:var(--bi)}.b{width:280px;height:280px;top:42%;left:46%;filter:blur(80px);background:var(--bb)}.card{max-width:440px;margin:16px;padding:36px;text-align:center;background:var(--surface);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.18)}h1{font-size:22px;margin:0;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}p{color:var(--muted);margin:14px 0 0;line-height:1.55}.svc{color:var(--text);font-weight:600}a.btn{display:inline-block;margin-top:24px;padding:11px 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:10px;text-decoration:none;font-weight:600}a.retry{display:block;margin-top:14px;color:var(--muted);font-size:13px}</style></head><body><div class="blobs"><div class="blob v"></div><div class="blob i"></div><div class="blob b"></div></div><div class="card"><h1>&#9875; Service unavailable</h1><p>The <span class="svc" id="s">Nucleus</span> isn&rsquo;t responding.</p><div id="act"><p id="checking">Checking for Anchor&hellip;</p></div><a class="retry" href="#" onclick="location.reload();return false">Retry</a></div><script>var anchor=location.protocol+"//"+location.hostname+":8888";var seg=location.pathname.split("/").filter(Boolean)[0];document.getElementById("s").textContent=seg?(seg.replace(/-/g," ")+" service"):"Nucleus hub";var act=document.getElementById("act");function clr(){while(act.firstChild)act.removeChild(act.firstChild);}function mkP(t){var p=document.createElement("p");p.textContent=t;return p;}function mkA(t,h){var a=document.createElement("a");a.className="btn";a.href=h;a.textContent=t;return a;}function showOpen(){clr();act.appendChild(mkP("Use Anchor to inspect and recover the stack."));act.appendChild(mkA("Open Anchor →",anchor));}function showDown(){clr();act.appendChild(mkP("Anchor is not responding — it is either stopped or not installed."));act.appendChild(mkA("Install Anchor →","https://example.com"));var hint=mkP("If it is already installed, start it and click Retry.");hint.style.cssText="font-size:13px;margin-top:16px";act.appendChild(hint);}var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},2500);fetch(anchor+"/healthz",{mode:"no-cors",signal:ctrl.signal}).then(function(){clearTimeout(to);showOpen();}).catch(function(){clearTimeout(to);showDown();});</script></body></html>';
    }
}
